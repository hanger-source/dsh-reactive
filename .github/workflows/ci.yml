name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装公开依赖
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: 构建六个工作区
        run: npm run build
      - name: 检查依赖方向和公开包
        run: |
          npm run check:boundaries
          npm run check:packages
      - name: 编译行为试验并统一模块身份
        run: |
          node scripts/prepare-test.mjs reset
          npx --no-install tsc -p tsconfig.test.json
          node scripts/prepare-test.mjs link
      - name: 核心、Gateway 网络与原生 Slot 行为
        run: |
          node --test --test-timeout=15000 .tmp/test/test/*.test.js
          npm run test --workspace @hanger-source/dsh-reactive-remote
          npm run test --workspace @hanger-source/dsh-reactive-native-ui
      - name: 严格编译业务和原生 UI 示例
        run: npm run typecheck:examples
      - name: 打包并检查仓外依赖、类型与运行入口
        run: |
          npm pack --workspaces --ignore-scripts --pack-destination .tmp --json > .tmp/workspace-pack.json
          node scripts/check-packed-types.mjs .tmp/workspace-pack.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workspace-packages
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
