name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装公开依赖
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: 从空产物独立构建原生UI及其浏览器前置任务
        run: |
          npm run build --workspace @hanger-source/dsh-reactive-native-ui
      - name: 严格编译框架与静态消费者
        run: npm run typecheck
      - name: 检查依赖方向和公开包
        run: |
          npm run check:boundaries
          npm run check:packages
      - name: 编译行为试验并统一模块身份
        run: npm run build:test
      - name: Changesets版本生成与发行来源
        run: npm run test:release
      - name: 核心、Gateway 网络与原生 Slot 行为
        run: |
          node --test --test-timeout=15000 .tmp/test/test/*.test.js
          npm run test --workspace @hanger-source/dsh-reactive-remote
          npm run test --workspace @hanger-source/dsh-reactive-native-ui
      - name: 安装实包消费使用的 Chromium
        run: npx playwright install --with-deps chromium
      - name: 打包并检查仓外依赖、类型、运行入口与真实浏览器
        run: |
          npm run prepare:packages
          npm pack --workspaces --ignore-scripts --pack-destination .tmp --json > .tmp/workspace-pack.json
          node scripts/check-packed-types.mjs .tmp/workspace-pack.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: |
            .tmp/browser-verification/
            .tmp/workspace-verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workspace-packages
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 单独验证业务和原生UI示例
        run: |
          npm run typecheck:examples
          npm run test:examples --workspace @hanger-source/dsh-reactive-remote
