name: npm Release

on:
  push:
    tags: ['dsh-reactive@*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 annotated 发行 tag，例如 dsh-reactive@0.2.1
        required: true
        type: string
      registration_run:
        description: 仅首次登记：提供已完成 prepare 的发行 run ID，将其原始产物提交 npm staging，待 2FA 批准
        required: false
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    if: ${{ !inputs.registration_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 安装公开构建依赖
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: 核验 annotated tag、来源和六包版本
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import semver from "semver";
            import { configuration, packages, capture, releaseSource } from "./scripts/release/common.mjs";
            const { version } = await packages(await configuration());
            const channel = semver.prerelease(version) ? "next" : "stable";
            const commit = await capture("git", ["rev-parse", "HEAD"]);
            await releaseSource({ commit, channel, tag: process.env.RELEASE_TAG }, true);
            for (const [key, value] of Object.entries({ commit, version, channel }))
              appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          '
      - name: 一次构建并准备可追溯的六包产物
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_CHANNEL: ${{ steps.source.outputs.channel }}
        run: npm run release -- prepare --channel "$RELEASE_CHANNEL" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG" --out "$GITHUB_WORKSPACE/.tmp/release"
      - name: 检查包边界和公开入口
        run: |
          npm run check:boundaries
          npm run check:packages
      - name: 编译并执行核心、Gateway 与原生 Slot 行为试验
        run: |
          npm run build:test
          node --test --test-timeout=15000 .tmp/test/test/*.test.js
          npm run test --workspace @hanger-source/dsh-reactive-remote
          npm run test --workspace @hanger-source/dsh-reactive-native-ui
      - name: 安装实包消费使用的 Chromium
        run: npx playwright install --with-deps chromium
      - name: 从实际候选安装并验收后台、可选原生域、原生 UI 和 Skill
        run: npm run release -- verify-artifacts --manifest .tmp/release/release-manifest.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: candidate-browser-verification
          path: .tmp/release/browser-verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release-candidate
          path: |
            .tmp/release/release-manifest.json
            .tmp/release/candidate-verification.json
            .tmp/release/packages/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: 单独验证业务和原生UI示例
        run: |
          npm run typecheck:examples
          npm run test:examples --workspace @hanger-source/dsh-reactive-remote

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 安装发行工具
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: 使用支持 Trusted Publishing 的 npm
        run: npm install --global npm@11
      - name: 安装 registry 消费使用的 Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .tmp/release
      - name: 发布已验证产物并从 npm registry 重新安装验收
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [ "$RELEASE_CHANNEL" = stable ]; then
            npm run release -- publish --manifest .tmp/release/release-manifest.json --also-latest
          else
            npm run release -- publish --manifest .tmp/release/release-manifest.json
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: registry-browser-verification
          path: .tmp/release/browser-verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: 发布 GitHub Release 与不可变产物
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [ "$RELEASE_CHANNEL" = next ]; then
            gh release create "$RELEASE_TAG" .tmp/release/packages/*.tgz .tmp/release/release-manifest.json .tmp/release/registry-verification.json --verify-tag --prerelease --title "$RELEASE_VERSION" --generate-notes
          else
            gh release create "$RELEASE_TAG" .tmp/release/packages/*.tgz .tmp/release/release-manifest.json .tmp/release/registry-verification.json --verify-tag --title "$RELEASE_VERSION" --generate-notes
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-publication-receipts
          path: |
            .tmp/release/publication.json
            .tmp/release/registry-verification.json
          if-no-files-found: ignore
          retention-days: 90

  register:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.registration_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 隔离首次登记的 npm 会话
        run: echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npm-first-registration.npmrc" >> "$GITHUB_ENV"
      - name: 安装发行工具
        run: |
          npm ci --ignore-scripts --registry https://registry.npmjs.org
          npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .tmp/release
          run-id: ${{ inputs.registration_run }}
          github-token: ${{ github.token }}
      - name: 核对原始发行来源和候选验收
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRATION_RUN: ${{ inputs.registration_run }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { currentArtifacts } from "./scripts/release/artifacts.mjs";
            import { json, configuration } from "./scripts/release/common.mjs";
            import { assertConsumerVerification } from "./scripts/release/consumer-profiles.mjs";
            const id = process.env.REGISTRATION_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error("REGISTRATION_RUN_INVALID");
            const api = path => JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}${path}`], { encoding: "utf8" }));
            const run = api(""), jobs = api("/jobs?filter=all&per_page=100");
            const { manifest, manifestSha256 } = await currentArtifacts(".tmp/release/release-manifest.json", true);
            const proof = await json(".tmp/release/candidate-verification.json");
            if (run.repository.full_name !== process.env.GITHUB_REPOSITORY || run.path !== ".github/workflows/release.yml"
              || run.head_sha !== manifest.commit || !jobs.jobs.some(job => job.name === "prepare" && job.conclusion === "success")
              || manifest.tag !== process.env.RELEASE_TAG || proof.source !== "artifacts"
              || proof.commit !== manifest.commit || proof.manifestSha256 !== manifestSha256
              || proof.version !== manifest.version || proof.registry !== manifest.registry)
              throw new Error("REGISTRATION_CANDIDATE_NOT_VERIFIED");
            assertConsumerVerification(proof, await configuration());
            console.log(JSON.stringify({ sourceRun: id, commit: manifest.commit, manifestSha256 }));
          '
      - name: 首次登记的 npm 官方网页登录
        run: npm login --auth-type=web --browser=false --registry https://registry.npmjs.org
      - name: 将 CI 原始产物提交 npm staging
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          REGISTRATION_RUN: ${{ inputs.registration_run }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { join } from "node:path";
            import { currentArtifacts } from "./scripts/release/artifacts.mjs";
            import { save } from "./scripts/release/common.mjs";
            const { directory, manifest, manifestSha256 } = await currentArtifacts(".tmp/release/release-manifest.json", true);
            const receipt = { sourceRun: process.env.REGISTRATION_RUN, workflowCommit: process.env.GITHUB_SHA,
              commit: manifest.commit, version: manifest.version, manifestSha256, packages: [] };
            for (const item of manifest.artifacts) {
              const result = JSON.parse(execFileSync("npm", ["stage", "publish", join(directory, item.file), "--access", "public",
                "--tag", manifest.channel, "--ignore-scripts", "--registry", manifest.registry, "--json"], { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] }));
              const stage = result[item.name];
              if (stage.version !== item.version || stage.integrity !== item.integrity || !stage.stageId)
                throw new Error(`REGISTRATION_ARTIFACT_MISMATCH: ${item.name}`);
              receipt.packages.push({ name: item.name, version: item.version, stageId: stage.stageId, integrity: stage.integrity });
              await save(join(directory, "staging.json"), receipt);
              console.log(JSON.stringify(receipt.packages.at(-1)));
            }
          '
      - name: 撤销 runner 的临时登录会话
        if: always()
        run: npm logout --registry https://registry.npmjs.org
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-registration-receipt
          path: .tmp/release/staging.json
          if-no-files-found: ignore
          retention-days: 90
